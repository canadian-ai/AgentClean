name: AgentClean CLI tests

on:
  push:
    paths:
      - 'scripts/history-clean.py'
      - 'tests/test_history_clean.py'
      - 'tests/contributor-check.test.js'
      - 'api/repository.js'
      - 'index.html'
      - '.github/workflows/history-clean-tests.yml'
  pull_request:
    paths:
      - 'scripts/history-clean.py'
      - 'tests/test_history_clean.py'
      - '.github/workflows/history-clean-tests.yml'

jobs:
  history-clean-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install git-filter-repo
        run: python -m pip install git-filter-repo
      - name: Test contributor classification API
        run: node --test tests/contributor-check.test.js
      - name: Compile CLI
        run: python -m py_compile scripts/history-clean.py
      - name: Test attribution cleanup
        run: python -m unittest discover -s tests -p 'test_history_clean.py' -v
